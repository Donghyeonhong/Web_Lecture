<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            width: 1000px;
            margin: 10px auto;
        }
        .TopTitle {
            width: 1000px;
            background-color: blue;
            color: white;
            text-align: center;
            border: 1px solid black;
        }
        .Menu {
            width: 1000px;
            overflow: hidden;
            border: 1px solid black;
        }
        .MenuBox {
            float: left;
            background-color: skyblue;
            text-align: center;
            width: 198px;
            height: 40px;
            padding-top: 20px;
            margin-right: 2px;
        }

        .LeftBox {
            float: left;
            width: 700px;
            height: 300px;
            padding-left: 10px;
            background-color: lightgray;
        }
        .RightBox {
            width: 290px;
            height: 300px;
            float: right;
            background-color: lightcyan;
            margin: 0 auto;
        }
        h3 {
            padding-left: 50px;
        }
        .Middle {
            overflow: hidden;
        }
        .QMenuBox {
            border: 1px solid black;
            width: 200px;
            height: 30px;
            margin: 5px auto;
            padding-top: 10px; 
            padding-left: 3px;
            background-color: lightgray;
        }
        .Bottom {
            border: 1px solid black;
            background-color: aqua;
            text-align: center;
            width: 1000px;
            height: 50px;
        }
        
    </style>
</head>
<body>
    <div class="TopTitle">
        <h1>COMPUTER SOFTWARE</h1>
        <h4>Daegu University Web Programming</h4>
    </div>

    <div class="Menu">
        <div class="MenuBox"> HOME </div>
        <div class="MenuBox"> 전공소개 </div>
        <div class="MenuBox"> 교과과정 </div>
        <div class="MenuBox"> 교수소개 </div>
        <div class="MenuBox"> CONTACT </div>
    </div>
    <div class="Middle">
        <div class="LeftBox">
            <h2>전공 소개</h2>
            <p>컴퓨터소프트웨어전공에서는 웹, 인공지능, 게임 및 소프트웨어 개발 등을 학습합니다.</p>
            <p>다양한 프로그래밍 언어와 소프트웨어 기술을 활용하여 실제 문제를 해결하는 방법을 학습합니다.</p>
        </div>

        <div class="RightBox">
            <h3>QUICK MENU</h3>
            <div class="QMenuBox">공지사항</div>
            <div class="QMenuBox">학사안내</div>
            <div class="QMenuBox">장학안내</div>
            <div class="QMenuBox">취업정보</div>
        </div>
    </div>
    <div class="Bottom">
        <p>Copyright 2026 Daegu University</p>
    </div>
    

</body>
</html>
